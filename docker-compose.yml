version: '3.8'

services:
  core-gateway:
    build: ./packages/core-gateway
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/mission_control
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  dashboard:
    build: ./dashboard
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:3000
    depends_on:
      - core-gateway

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=mission_control
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
