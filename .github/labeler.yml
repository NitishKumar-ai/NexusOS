# Auto-label rules based on changed files

"rust":
  - changed-files:
    - any-glob-to-any-file: 'packages/traffic-controller/**'

"connectors":
  - changed-files:
    - any-glob-to-any-file: 'packages/connectors/**'

"dashboard":
  - changed-files:
    - any-glob-to-any-file: 'dashboard/**'

"sdk-bridge":
  - changed-files:
    - any-glob-to-any-file: 'packages/sdk-bridge/**'

"openclaw":
  - changed-files:
    - any-glob-to-any-file: 'packages/openclaw-skill/**'

"agent-harness":
  - changed-files:
    - any-glob-to-any-file: 'packages/agent-harness/**'

"ci":
  - changed-files:
    - any-glob-to-any-file: '.github/**'

"docs":
  - changed-files:
    - any-glob-to-any-file: 'docs/**'
    - any-glob-to-any-file: '*.md'
    - any-glob-to-any-file: 'README.md'

"infrastructure":
  - changed-files:
    - any-glob-to-any-file: 'docker-compose.yml'
    - any-glob-to-any-file: 'pnpm-workspace.yaml'

"security":
  - changed-files:
    - any-glob-to-any-file: 'packages/agent-harness/security/**'
    - any-glob-to-any-file: '**/security/**'

"dependencies":
  - changed-files:
    - any-glob-to-any-file: '**/package.json'
    - any-glob-to-any-file: '**/Cargo.toml'
    - any-glob-to-any-file: '**/pnpm-lock.yaml'
    - any-glob-to-any-file: '**/Cargo.lock'
