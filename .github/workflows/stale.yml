name: Stale Issues

on:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            This issue has been inactive for 30 days.
            It will be closed in 7 days unless there is new activity.
            If this is still relevant, please leave a comment.
          close-issue-message: |
            Closed due to inactivity. Feel free to re-open if still relevant.

          # PRs
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            This PR has been inactive for 14 days.
            It will be closed in 7 days unless there is new activity.
          close-pr-message: |
            Closed due to inactivity.

          # Never mark these as stale
          exempt-issue-labels: 'pinned,security,in-progress,blocked'
          exempt-pr-labels: 'pinned,security,in-progress,blocked'
