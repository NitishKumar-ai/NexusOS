name: Bug Report
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Which layer?
      options:
        - Traffic Controller (Rust)
        - Connectors (Node.js)
        - Dashboard (Next.js)
        - OpenClaw integration
        - Agent Harness (ECC)
        - CI/CD
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug clearly
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run...
        2. Submit...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      render: shell
